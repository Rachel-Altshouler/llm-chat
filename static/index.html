<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>צ'אט</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #0b0d17;
      --panel: rgba(255, 255, 255, 0.06);
      --panel-border: rgba(255, 255, 255, 0.10);
      --text: #eef0f8;
      --muted: #9aa0b8;
      --accent-1: #7c5cff;
      --accent-2: #00d4ff;
      --gradient: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      --assistant-bg: rgba(255, 255, 255, 0.07);
      --error-bg: rgba(255, 82, 99, 0.15);
      --error-text: #ff9aa5;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f3f4fb;
        --panel: rgba(255, 255, 255, 0.75);
        --panel-border: rgba(20, 24, 50, 0.08);
        --text: #171a2c;
        --muted: #6b7090;
        --assistant-bg: #ffffff;
        --error-bg: #fde8ea;
        --error-text: #b4232f;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Rubik", system-ui, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    /* Soft animated glow in the background */
    body::before, body::after {
      content: "";
      position: fixed;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      filter: blur(110px);
      opacity: .35;
      z-index: -1;
      animation: float 18s ease-in-out infinite alternate;
    }
    body::before { background: var(--accent-1); top: -160px; right: -120px; }
    body::after { background: var(--accent-2); bottom: -200px; left: -140px; animation-delay: -9s; }
    @keyframes float {
      to { transform: translate(60px, 40px) scale(1.15); }
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--panel-border);
      backdrop-filter: blur(16px);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--gradient);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 20px;
      box-shadow: 0 6px 20px rgba(124, 92, 255, .45);
    }
    header h1 { font-size: 18px; margin: 0; font-weight: 700; }
    .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #2ee59d;
      box-shadow: 0 0 8px #2ee59d;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      scroll-behavior: smooth;
    }

    /* Welcome screen, hidden as soon as there is a message */
    #welcome {
      margin: auto;
      text-align: center;
      animation: pop .5s ease both;
    }
    #chat:has(.msg) #welcome { display: none; }
    #welcome .logo { width: 72px; height: 72px; font-size: 34px; border-radius: 22px; margin: 0 auto 18px; }
    #welcome h2 {
      font-size: 30px;
      margin: 0 0 8px;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    #welcome p { color: var(--muted); margin: 0 0 24px; }
    .suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .suggestion {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 999px;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: transform .15s, border-color .15s;
    }
    .suggestion:hover { transform: translateY(-2px); border-color: var(--accent-1); }

    .msg {
      padding: 12px 16px;
      border-radius: 18px;
      max-width: 85%;
      line-height: 1.65;
      word-wrap: break-word;
      animation: pop .25s ease both;
    }
    .msg p { margin: 0 0 8px; }
    .msg p:last-child { margin-bottom: 0; }
    .user {
      align-self: flex-start;
      background: var(--gradient);
      color: #fff;
      border-bottom-right-radius: 6px;
      box-shadow: 0 8px 24px rgba(124, 92, 255, .30);
    }
    .assistant {
      align-self: flex-end;
      background: var(--assistant-bg);
      border: 1px solid var(--panel-border);
      border-bottom-left-radius: 6px;
      backdrop-filter: blur(10px);
    }
    .error {
      align-self: center;
      background: var(--error-bg);
      color: var(--error-text);
      font-size: 14px;
    }
    @keyframes pop {
      from { opacity: 0; transform: translateY(8px) scale(.98); }
    }

    /* Markdown rendered as HTML inside the assistant bubble */
    .assistant h1, .assistant h2, .assistant h3 { margin: 4px 0 8px; line-height: 1.3; }
    .assistant h1 { font-size: 20px; }
    .assistant h2 { font-size: 18px; }
    .assistant h3 { font-size: 16px; }
    .assistant ul, .assistant ol { margin: 0 0 8px; padding-inline-start: 22px; }
    .assistant li { margin: 2px 0; }
    .assistant code {
      font-family: Consolas, "Courier New", monospace;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      padding: 1px 6px;
      border-radius: 6px;
      font-size: .9em;
    }
    .assistant pre {
      direction: ltr;
      text-align: left;
      background: rgba(0, 0, 0, .35);
      padding: 12px;
      border-radius: 10px;
      overflow-x: auto;
      margin: 0 0 8px;
    }
    .assistant pre code { background: none; border: 0; padding: 0; }
    .assistant table { border-collapse: collapse; margin: 0 0 8px; }
    .assistant th, .assistant td { border: 1px solid var(--panel-border); padding: 6px 10px; }
    .assistant blockquote {
      margin: 0 0 8px;
      padding-inline-start: 12px;
      border-inline-start: 3px solid var(--accent-1);
      color: var(--muted);
    }

    /* Blinking cursor at the end of the answer while it streams */
    .caret {
      display: inline-block;
      width: 8px;
      height: 16px;
      background: var(--accent-2);
      vertical-align: text-bottom;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* Badges under the answer: streaming + token counts */
    .meta {
      align-self: flex-end;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: -6px;
    }
    .badge {
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      padding: 3px 9px;
      border-radius: 6px;
      direction: ltr;
    }
    .badge.streaming { background: rgba(0, 212, 255, .15); color: var(--accent-2); }
    .badge.tokens { background: rgba(255, 170, 60, .15); color: #ffb454; }

    /* Typing indicator shown until the first streamed chunk arrives */
    .dots { display: inline-flex; gap: 5px; padding: 4px 2px; }
    .dots i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gradient);
      animation: bounce 1.2s infinite ease-in-out;
    }
    .dots i:nth-child(2) { animation-delay: .15s; }
    .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: .4; }
      40% { transform: translateY(-6px); opacity: 1; }
    }

    .composer { padding: 12px 16px 20px; }
    form {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      max-width: 820px;
      margin: 0 auto;
      padding: 8px 8px 8px 8px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 22px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, .25);
      transition: border-color .2s, box-shadow .2s;
    }
    form:focus-within {
      border-color: var(--accent-1);
      box-shadow: 0 10px 40px rgba(124, 92, 255, .30);
    }
    textarea {
      flex: 1;
      resize: none;
      padding: 10px 12px;
      font: inherit;
      color: var(--text);
      background: transparent;
      border: 0;
      outline: none;
      max-height: 180px;
      line-height: 1.5;
    }
    textarea::placeholder { color: var(--muted); }
    button { font: inherit; cursor: pointer; }
    #send {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border: 0;
      border-radius: 14px;
      background: var(--gradient);
      color: #fff;
      display: grid;
      place-items: center;
      transition: transform .15s, opacity .15s;
    }
    #send:hover:not(:disabled) { transform: scale(1.06); }
    #send:disabled { opacity: .45; cursor: default; }
    #clear {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--panel-border);
      padding: 8px 14px;
      border-radius: 10px;
      transition: border-color .15s;
    }
    #clear:hover { border-color: var(--accent-1); }

    #chat::-webkit-scrollbar { width: 8px; }
    #chat::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 8px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">✦</div>
      <div>
        <h1>העוזר החכם</h1>
        <div class="status">מחובר</div>
      </div>
    </div>
    <button id="clear" type="button">✚ שיחה חדשה</button>
  </header>

  <main id="chat">
    <section id="welcome">
      <div class="logo">✦</div>
      <h2>שלום! במה אפשר לעזור?</h2>
      <p>שאל אותי כל דבר, או בחר אחת מההצעות</p>
      <div class="suggestions">
        <button class="suggestion" type="button">ספר לי עובדה מעניינת על החלל</button>
        <button class="suggestion" type="button">תן לי רעיון לארוחת ערב מהירה</button>
        <button class="suggestion" type="button">הסבר מה זה סטרימינג בצורה פשוטה</button>
      </div>
    </section>
  </main>

  <div class="composer">
    <form id="form">
      <textarea id="input" rows="1" placeholder="כתוב הודעה... "></textarea>
      <button id="send" type="submit" aria-label="שלח">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </button>
    </form>
  </div>

  <script>
    // Conversation memory - lives only on the client and is sent in full with every request
    let messages = [];

    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    // Render text as regular elements: a <p> per paragraph, <br> per line.
    // textContent is used so nothing from the model is interpreted as HTML/Markdown.
    function renderText(el, text) {
      el.replaceChildren();
      for (const para of text.split(/\n{2,}/)) {
        const p = document.createElement("p");
        para.split("\n").forEach((line, i) => {
          if (i > 0) p.appendChild(document.createElement("br"));
          p.appendChild(document.createTextNode(line));
        });
        el.appendChild(p);
      }
    }

    // Render the model's Markdown as (sanitized) HTML, with a cursor while it is still streaming
    function renderMarkdown(el, text, streaming) {
      el.innerHTML = DOMPurify.sanitize(marked.parse(text));
      if (streaming) {
        const caret = document.createElement("span");
        caret.className = "caret";
        (el.lastElementChild || el).appendChild(caret);
      }
    }

    function addBadge(meta, cls, text) {
      const span = document.createElement("span");
      span.className = "badge " + cls;
      span.textContent = text;
      meta.appendChild(span);
    }

    function addBubble(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      renderText(div, text);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function addTypingBubble() {
      const div = document.createElement("div");
      div.className = "msg assistant";
      div.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    // Grow the textarea with its content (up to the CSS max-height)
    function autoResize() {
      input.style.height = "auto";
      input.style.height = input.scrollHeight + "px";
    }

    async function send(text) {
      messages.push({ role: "user", content: text });
      addBubble("user", text);

      const bubble = addTypingBubble();
      const meta = document.createElement("div");
      meta.className = "meta";
      addBadge(meta, "streaming", "streaming");
      let answer = "";
      sendBtn.disabled = true;

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages }),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);

        // Read the SSE stream: events are separated by a blank line, each starts with "data: "
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          let sep;
          while ((sep = buffer.indexOf("\n\n")) !== -1) {
            const raw = buffer.slice(0, sep);
            buffer = buffer.slice(sep + 2);
            if (!raw.startsWith("data: ")) continue;

            const event = JSON.parse(raw.slice(6));
            if (event.type === "delta") {
              answer += event.delta;
              renderMarkdown(bubble, answer, true);
              if (!meta.isConnected) chat.appendChild(meta);
              chat.scrollTop = chat.scrollHeight;
            } else if (event.type === "usage") {
              addBadge(meta, "tokens", "input_tokens: " + event.input_tokens);
              addBadge(meta, "tokens", "output_tokens: " + event.output_tokens);
            } else if (event.type === "error") {
              throw new Error(event.message);
            }
          }
        }

        // Final render without the cursor
        renderMarkdown(bubble, answer, false);
        chat.scrollTop = chat.scrollHeight;
        messages.push({ role: "assistant", content: answer });
      } catch (err) {
        bubble.remove();
        meta.remove();
        // Drop the unanswered user message so the history stays consistent
        messages.pop();
        addBubble("error", "שגיאה: " + err.message);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || sendBtn.disabled) return;
      input.value = "";
      autoResize();
      send(text);
    });

    input.addEventListener("input", autoResize);

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    document.querySelectorAll(".suggestion").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (!sendBtn.disabled) send(btn.textContent);
      });
    });

    document.getElementById("clear").addEventListener("click", () => {
      messages = [];
      chat.replaceChildren(welcome);
      input.focus();
    });
  </script>
</body>
</html>
