<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>צ'אט</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #0b0d17;
      --panel: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.10);
      --text: #eef0f8;
      --muted: #9aa0b8;
      --accent-1: #7c5cff;
      --accent-2: #00d4ff;
      --gradient: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f3f4fb;
        --panel: rgba(255, 255, 255, 0.75);
        --border: rgba(20, 24, 50, 0.08);
        --text: #171a2c;
        --muted: #6b7090;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Rubik", system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    body::before, body::after {
      content: "";
      position: fixed;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      filter: blur(110px);
      opacity: .35;
      z-index: -1;
    }
    body::before { background: var(--accent-1); top: -160px; right: -120px; }
    body::after { background: var(--accent-2); bottom: -200px; left: -140px; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 18px; margin: 0; }
    .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--gradient);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 20px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }
    #welcome { margin: auto; text-align: center; }
    #chat:has(.msg) #welcome { display: none; }
    #welcome .logo { width: 72px; height: 72px; font-size: 34px; margin: 0 auto 18px; }
    #welcome p { color: var(--muted); }
    .suggestion {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 16px;
      margin: 4px;
      border-radius: 999px;
    }

    .msg {
      padding: 12px 16px;
      border-radius: 18px;
      max-width: 85%;
      line-height: 1.65;
      word-wrap: break-word;
    }
    .user { align-self: flex-start; background: var(--gradient); color: #fff; white-space: pre-wrap; }
    .assistant { align-self: flex-end; background: var(--panel); border: 1px solid var(--border); }
    .error { align-self: center; background: rgba(255, 82, 99, .15); color: #ff6b7a; }
    .assistant > :first-child { margin-top: 0; }
    .assistant > :last-child { margin-bottom: 0; }
    .assistant pre { direction: ltr; text-align: left; background: rgba(0, 0, 0, .3); padding: 12px; border-radius: 10px; overflow-x: auto; }

    .dots i {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin: 0 2px;
      border-radius: 50%;
      background: var(--gradient);
      animation: bounce 1.2s infinite;
    }
    .dots i:nth-child(2) { animation-delay: .15s; }
    .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 40% { transform: translateY(-6px); } }

    .caret {
      display: inline-block;
      width: 8px;
      height: 16px;
      background: var(--accent-2);
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .meta { align-self: flex-end; display: flex; gap: 6px; margin-top: -6px; }
    .badge { font-family: Consolas, monospace; font-size: 12px; padding: 3px 9px; border-radius: 6px; direction: ltr; }
    .badge.streaming { background: rgba(0, 212, 255, .15); color: var(--accent-2); }
    .badge.tokens { background: rgba(255, 170, 60, .15); color: #ffb454; }

    form {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      max-width: 820px;
      width: calc(100% - 32px);
      margin: 12px auto 20px;
      padding: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
    }
    form:focus-within { border-color: var(--accent-1); }
    textarea {
      flex: 1;
      resize: none;
      padding: 10px 12px;
      font: inherit;
      color: var(--text);
      background: transparent;
      border: 0;
      outline: none;
      max-height: 180px;
    }
    button { font: inherit; cursor: pointer; }
    #send {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 14px;
      background: var(--gradient);
      color: #fff;
      font-size: 20px;
    }
    #send:disabled { opacity: .45; cursor: default; }
    #clear {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">✦</div>
      <h1>העוזר החכם</h1>
    </div>
    <button id="clear" type="button">✚ שיחה חדשה</button>
  </header>

  <main id="chat">
    <section id="welcome">
      <div class="logo">✦</div>
      <h2>שלום! במה אפשר לעזור?</h2>
      <p>שאל אותי כל דבר, או בחר אחת מההצעות</p>
      <button class="suggestion" type="button">ספר לי עובדה מעניינת על החלל</button>
      <button class="suggestion" type="button">תן לי רעיון לארוחת ערב מהירה</button>
      <button class="suggestion" type="button">הסבר מה זה סטרימינג בצורה פשוטה</button>
    </section>
  </main>

  <form id="form">
    <textarea id="input" rows="1" placeholder="כתוב הודעה..."></textarea>
    <button id="send" type="submit">➤</button>
  </form>

  <script>
    let messages = [];

    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    function addElement(className, text = "") {
      const el = document.createElement("div");
      el.className = className;
      el.textContent = text;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      return el;
    }

    function showMarkdown(el, text, streaming) {
      el.innerHTML = DOMPurify.sanitize(marked.parse(text)) + (streaming ? '<span class="caret"></span>' : "");
      chat.scrollTop = chat.scrollHeight;
    }

    async function* readEvents(res) {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) return;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split("\n\n");
        buffer = parts.pop();
        for (const part of parts) {
          if (part.startsWith("data: ")) yield JSON.parse(part.slice(6));
        }
      }
    }

    async function send(text) {
      messages.push({ role: "user", content: text });
      addElement("msg user", text);
      const bubble = addElement("msg assistant");
      bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
      const meta = addElement("meta");
      meta.innerHTML = '<span class="badge streaming">streaming</span>';
      let answer = "";
      sendBtn.disabled = true;

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages }),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);

        for await (const event of readEvents(res)) {
          if (event.type === "delta") {
            answer += event.delta;
            showMarkdown(bubble, answer, true);
          } else if (event.type === "usage") {
            meta.innerHTML +=
              `<span class="badge tokens">input_tokens: ${event.input_tokens}</span>` +
              `<span class="badge tokens">output_tokens: ${event.output_tokens}</span>`;
          } else if (event.type === "error") {
            throw new Error(event.message);
          }
        }

        showMarkdown(bubble, answer, false);
        messages.push({ role: "assistant", content: answer });
      } catch (err) {
        bubble.remove();
        meta.remove();
        messages.pop();
        addElement("msg error", "שגיאה: " + err.message);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || sendBtn.disabled) return;
      input.value = "";
      input.style.height = "auto";
      send(text);
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = input.scrollHeight + "px";
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    document.querySelectorAll(".suggestion").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (!sendBtn.disabled) send(btn.textContent);
      });
    });

    document.getElementById("clear").addEventListener("click", () => {
      messages = [];
      chat.replaceChildren(welcome);
    });
  </script>
</body>
</html>
